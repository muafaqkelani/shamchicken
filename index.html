<head>
    <meta charset="UTF-8">

    <title>مأكولات الشام | Sham Bites - Hama</title>
    
    <meta name="description" content="Sham Bites Hama - The finest fast food, shawarma, and crispy chicken in Syria. Fast delivery to all farms.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1562967914-608f82629710?q=80&w=1000&auto=format&fit=crop">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#E31E24',
                        brandYellow: '#FFC800',
                        darkBg: '#111827',
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '3.5rem',
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'float': 'float 4s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-subtle': 'bounceSubtle 2s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },

                            '100%': { opacity: '1', transform: 'translateY(0)' },

                        bounceSubtle: {
                            '0%, 100%': { transform: 'translateY(0)' },

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <style>
        body { background-color: #f9fafb; overflow-x: hidden; }
        .font-ar { font-family: 'Cairo', sans-serif; }
        .font-en { font-family: 'Outfit', sans-serif; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .category-tab-active {
            box-shadow: 0 10px 25px -5px rgba(227, 30, 36, 0.4);
        }

        html { scroll-behavior: smooth; }
        section { scroll-margin-top: 100px; }

        .hero-img-transition {
            transition: opacity 1.5s ease-in-out;
        }

        .loader-container {
            position: fixed;
            inset: 0;
            background-color: #111827;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
        }
        .loader-container.hidden-loader {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loading-bar-container {
            width: 150px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 20px; overflow: hidden;
        }
        .loading-bar {
            width: 50%; height: 100%; background: #E31E24; animation: loadingBarAnim 1s infinite linear;
        }
        @keyframes loadingBarAnim { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
    </style>
</head>
<body class="text-darkBg">

    <script type="text/babel">

                pizza: 'بيتزا',
                burger: 'برجر',
                appetizers: 'مقبلات',
                statusOpen: 'مفتوح 24/7',
                branch1: 'فرع العاصي',
                branch1Desc: 'حماة - وسط البلد - ساحة العاصي',
                branch2: 'فرع الشريعة',
                branch2Desc: 'حماة - حي الشريعة - الشارع العام',

                copyright: 'جميع الحقوق محفوظة للمطعم',
                madeByPrefix: 'صُنع بواسطة',
                developerName: 'المهندس محمد موفق كيلاني',
                whatsappOrderMsg: 'مرحباً مأكولات الشام، أريد طلب:'
            },
            en: {
                dir: 'ltr',
                font: 'font-en',
                navHome: 'Home',
                navMenu: 'Menu',
                navAI: 'AI Assistant',
                navBranches: 'Branches',
                navAbout: 'About',
                heroBadge: 'Hello Friend!',
                heroTitle: 'From the City Center..',
                heroTitleColor: 'Authentic Taste',
                heroDesc: 'Treat yourself to the best crispy chicken and shawarma in Hama. Global quality with a local touch!',
                btnMenu: 'View Menu',
                btnOrder: 'Order Now',
                freeDelivery: 'Free Delivery to All Areas',
                aiTitle: 'Smart AI Assistant',
                aiDesc: "Can't decide? Tell us what you crave or your budget, and our AI will pick for you!",
                aiPlaceholder: 'e.g., I want a meal for two people under 100k, chicken-based...',
                aiBtn: 'Magic Suggestion ✨',
                aiThinking: 'Brewing magic...',
                aiVpn: 'Note: The AI Assistant now runs securely through our dedicated servers.',
                menuTitle: 'Our Menu',
                loadMore: 'Load More',
                all: 'All',
                shawarma: 'Shawarma',
                crispy: 'Crispy',
                pizza: 'Pizza',
                burger: 'Burger',
                appetizers: 'Sides',
                statusOpen: 'Open 24/7',
                branch1: 'Al-Asi Branch',
                branch1Desc: 'Hama - City Center - Al-Asi Square',
                branch2: 'Al-Shari\'a Branch',
                branch2Desc: 'Hama - Al-Shari\'a District - Main Street',
                footerDesc: 'At Sham Bites, we strive to provide the best fast food experience in Hama, focusing on quality and speed.',
                copyright: 'All Rights Reserved to Sham Bites',
                madeByPrefix: 'Developed by',
                developerName: 'Eng. Muafaq Kelani',
                whatsappOrderMsg: 'Hello Sham Bites, I would like to order:'
            }
        };

        const heroImages = [
            "https://images.unsplash.com/photo-1561651823-34fed0225304?q=80&w=1200", 
            "https://images.unsplash.com/photo-1562967914-608f82629710?q=80&w=1200", 
            "https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1200", 
            "https://images.unsplash.com/photo-1510629954389-c1e0da47d414?q=80&w=1200", 
            "https://images.unsplash.com/photo-1573225342350-16731dd9bf3d?q=80&w=1200"  
        ];

        const menuItems = [
            { id: 1, category: 'shawarma', price: "35,000", ar: "شاورما دبل", en: "Double Shawarma", img: "https://images.unsplash.com/photo-1561651823-34fed0225304?w=400" },
            { id: 2, category: 'shawarma', price: "55,000", ar: "وجبة شاورما عربي", en: "Arabic Shawarma Meal", img: "https://images.unsplash.com/photo-1646672322525-4fc11f951838?w=400" },
            { id: 3, category: 'shawarma', price: "40,000", ar: "سندويش صاروخ", en: "Rocket Sandwich", img: "https://images.unsplash.com/photo-1662116765994-1e0e85f6901a?w=400" },
            { id: 4, category: 'crispy', price: "60,000", ar: "وجبة كرسبي 5 قطع", en: "5pc Crispy Meal", img: "https://images.unsplash.com/photo-1562967914-608f82629710?w=400" },
            { id: 5, category: 'crispy', price: "80,000", ar: "وجبة كرسبي عائلية", en: "Family Crispy Meal", img: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400" },
            { id: 6, category: 'crispy', price: "45,000", ar: "كرسبي رول", en: "Crispy Roll", img: "https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?w=400" },
            { id: 7, category: 'pizza', price: "55,000", ar: "بيتزا ميكس تشيكن", en: "Chicken Mix Pizza", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" },
            { id: 8, category: 'pizza', price: "45,000", ar: "بيتزا مارغريتا", en: "Margherita Pizza", img: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400" },
            { id: 9, category: 'pizza', price: "50,000", ar: "بيتزا فصول أربعة", en: "Four Seasons Pizza", img: "https://images.unsplash.com/photo-1541745537411-b8046dc6d66c?w=400" },
            { id: 10, category: 'burger', price: "50,000", ar: "زنجر سوبريم", en: "Zinger Supreme", img: "https://images.unsplash.com/photo-1510629954389-c1e0da47d414?w=400" },
            { id: 11, category: 'burger', price: "40,000", ar: "برجر دجاج كلاسيك", en: "Classic Chicken Burger", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" },
            { id: 12, category: 'burger', price: "65,000", ar: "دبل تشيز برجر", en: "Double Cheese Burger", img: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=400" },
            { id: 13, category: 'appetizers', price: "20,000", ar: "بطاطا بالجبنة", en: "Cheese Fries", img: "https://images.unsplash.com/photo-1573225342350-16731dd9bf3d?w=400" },
            { id: 14, category: 'appetizers', price: "25,000", ar: "سلطة سيزر", en: "Caesar Salad", img: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=400" },
            { id: 15, category: 'appetizers', price: "15,000", ar: "كول سلو", en: "Coleslaw Salad", img: "https://images.unsplash.com/photo-1599307767316-776533bb941c?w=400" },
            { id: 16, category: 'shawarma', price: "70,000", ar: "بوكس شاورما عائلي", en: "Family Shawarma Box", img: "https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=400" },
        ];

        const App = () => {
            const [isAppLoaded, setIsAppLoaded] = useState(false);
            const [lang, setLang] = useState('ar');
            const [scrolled, setScrolled] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [activeCat, setActiveCat] = useState('all');
            const [visibleCount, setVisibleCount] = useState(8);
            
            const [heroIndex, setHeroIndex] = useState(0);
            const [isHeroVisible, setIsHeroVisible] = useState(true);
            const heroRef = useRef(null);
            const categoryRef = useRef(null);
            
            const [showLeftArrow, setShowLeftArrow] = useState(false);
            const [showRightArrow, setShowRightArrow] = useState(true);

            const [aiInput, setAiInput] = useState('');
            const [aiResponse, setAiResponse] = useState('');
            const [aiError, setAiError] = useState('');
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [aiCooldown, setAiCooldown] = useState(0);

            const t = translations[lang];

            useEffect(() => {
                const loader = document.getElementById('initial-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 600);
                }
            }, []);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 40);
                window.addEventListener('scroll', handleScroll);
                document.documentElement.dir = t.dir;
                document.documentElement.lang = lang;
                return () => window.removeEventListener('scroll', handleScroll);
            }, [lang]);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => setIsHeroVisible(entry.isIntersecting),
                    { threshold: 0.1 }
                );
                if (heroRef.current) observer.observe(heroRef.current);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                let timer;
                if (isHeroVisible) {
                    timer = setInterval(() => {
                        setHeroIndex((prev) => (prev + 1) % heroImages.length);
                    }, 4000);
                }
                return () => clearInterval(timer);
            }, [isHeroVisible]);

            useEffect(() => {
                let timer;
                if (aiCooldown > 0) {
                    timer = setInterval(() => setAiCooldown(c => c - 1), 1000);
                }
                return () => clearInterval(timer);
            }, [aiCooldown]);

            const handleCategoryScroll = () => {
                if (categoryRef.current) {
                    const { scrollLeft, scrollWidth, clientWidth } = categoryRef.current;
                    const isRtl = document.documentElement.dir === 'rtl';
                    
                    if (isRtl) {
                        setShowRightArrow(Math.abs(scrollLeft) < scrollWidth - clientWidth - 5);
                        setShowLeftArrow(Math.abs(scrollLeft) > 5);
                    } else {
                        setShowLeftArrow(scrollLeft > 5);
                        setShowRightArrow(scrollLeft < scrollWidth - clientWidth - 5);
                    }
                }
            };

            useEffect(() => {
                handleCategoryScroll();
                window.addEventListener('resize', handleCategoryScroll);
                return () => window.removeEventListener('resize', handleCategoryScroll);
            }, [lang, activeCat]); 

            const scrollCategories = (direction) => {
                if (categoryRef.current) {
                    const scrollAmount = 200;
                    const isRtl = document.documentElement.dir === 'rtl';
                    let finalScroll = 0;
                    if (isRtl) {
                        finalScroll = direction === 'next' ? -scrollAmount : scrollAmount;
                    } else {
                        finalScroll = direction === 'next' ? scrollAmount : -scrollAmount;
                    }
                    categoryRef.current.scrollBy({ left: finalScroll, behavior: 'smooth' });
                    setTimeout(handleCategoryScroll, 300);
                }
            };

            const filteredItems = menuItems.filter(item => activeCat === 'all' || item.category === activeCat);
            const displayedItems = filteredItems.slice(0, visibleCount);

            const handleImageError = (e) => { e.target.src = 'https://placehold.co/150x150/FFC800/111827?text=Logo'; };

            const formatAIResponse = (text) => {
                if (!text) return { __html: '' };
                let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                
                safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-brandYellow font-black text-[1.1em] px-1">$1</strong>');
                safeText = safeText.replace(/(^|\n)[-*]\s+(.*?)(?=\n|$)/g, '$1<div class="flex items-start gap-2 my-2"><i class="fa-solid fa-check text-primary mt-1.5 text-sm shrink-0"></i><span class="flex-1">$2</span></div>');
                safeText = safeText.replace(/\*(.*?)\*/g, '<em class="italic opacity-90">$1</em>');
                safeText = safeText.replace(/<\/div>\n/g, '</div>[TEMP_NEWLINE]');
                safeText = safeText.replace(/\n/g, '<br/>');
                safeText = safeText.replace(/\[TEMP_NEWLINE\]/g, '\n');
                return { __html: safeText };
            };

            const getWhatsAppLink = (itemName) => {
                const phoneNumber = "963900000000"; 
                const message = `${t.whatsappOrderMsg} ${itemName}`;
                return `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            };

            // التعديل تم هنا: تم توجيه الطلب إلى Netlify Function
            const generateAIRecommendation = async () => {
                if (!aiInput.trim() || aiCooldown > 0) return;
                
                setIsAiLoading(true);
                setAiResponse('');
                setAiError('');

                try {
                    const endpoint = '/.netlify/functions/gemini';
                    const menuList = menuItems.map(i => `${i[lang]}: ${i.price} SYP`).join(', ');
                    
                    const systemPrompt = lang === 'ar' 
                        ? `أنت مساعد ذكي ومرح في مطعم "مأكولات الشام" بحماة. المنيو وأسعاره: ${menuList}. 
                           تحدث باللهجة السورية الحموية حصراً، واقترح من المنيو بناءً على طلب الزبون. 
                           مهم جداً: استخدم النجمتين ** ** لتمييز أسماء الوجبات، ويمكنك استخدام الشرطات (-) لعمل قائمة نقطية. لا تخترع وجبات.`
                        : `You are an AI assistant for "Sham Bites" restaurant in Hama, Syria. Menu: ${menuList}. 
                           Speak professionally in English, suggest meals based on the user's input. 
                           Crucial: Use double asterisks ** ** to bold meal names, use dashes (-) for bullet points. Do not invent items.`;

                    const payload = {
                        message: aiInput,
                        systemPrompt: systemPrompt
                    };

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    
                    if (!response.ok || data.error) {
                        throw new Error(data.error || `HTTP Error ${response.status}`);
                    }
                    
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (aiText) {
                        setAiResponse(aiText);
                        setAiCooldown(15); 
                    } else {
                        throw new Error("Empty response from AI");
                    }
                } catch (err) {
                    console.error("AI Error Details:", err);
                    setAiError(lang === 'ar' ? `خطأ تقني: ${err.message}` : `Error: ${err.message}`);
                } finally {
                    setIsAiLoading(false);
                }
            };

            const closeMenuAndNavigate = (e, id) => {
                e.preventDefault();
                setIsMenuOpen(false);
                if(id === '#') {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    const element = document.querySelector(id);
                    if (element) {
                        const navHeight = 90; 
                        const elementPosition = element.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.scrollY - navHeight;
                        
                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });
                    }
                }
            };

            return (
                <div className={`${t.font} transition-all duration-500 relative`}>
                    
                    <nav className={`fixed top-0 start-0 w-full z-[100] transition-all duration-500 ${scrolled ? 'bg-gray-900/95 backdrop-blur-xl shadow-2xl border-b border-gray-700 py-3' : 'bg-transparent py-6'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            
                            <div className="flex items-center gap-4 relative z-20">
                                <img 
                                    src="https://placehold.co/150x150/FFC800/111827?text=Logo" 
                                    onError={handleImageError}
                                    className="w-12 h-12 rounded-full border-2 border-brandYellow shadow-lg object-cover bg-white" 
                                    alt="Logo" 
                                />
                                <div className="flex flex-col md:flex-row md:items-center md:gap-2">
                                    {lang === 'ar' && <span className="text-2xl font-black tracking-tighter text-white drop-shadow-md">مأكولات الشام</span>}
                                    <span className={`font-black tracking-tighter text-white drop-shadow-md opacity-90 ${lang === 'en' ? 'text-2xl' : 'text-sm md:text-xl'}`}>SHAM BITES</span>
                                </div>
                            </div>

                            <div className="hidden lg:flex items-center space-x-8 rtl:space-x-reverse font-bold">
                                <a href="#" onClick={(e) => closeMenuAndNavigate(e, '#')} className="text-gray-100 hover:text-brandYellow transition-colors drop-shadow-sm">{t.navHome}</a>
                                <a href="#menu" onClick={(e) => closeMenuAndNavigate(e, '#menu')} className="text-gray-100 hover:text-brandYellow transition-colors drop-shadow-sm">{t.navMenu}</a>
                                <a href="#ai" onClick={(e) => closeMenuAndNavigate(e, '#ai')} className="text-primary font-black hover:scale-105 transition-transform drop-shadow-sm">{t.navAI} ✨</a>
                                <a href="#about" onClick={(e) => closeMenuAndNavigate(e, '#about')} className="text-gray-100 hover:text-brandYellow transition-colors drop-shadow-sm">{t.navAbout}</a>
                                
                                <button 
                                    onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')}
                                    className="px-4 py-1 rounded-full border-2 transition-all font-bold hover:bg-brandYellow hover:text-darkBg hover:border-brandYellow border-white/40 text-white"
                                >
                                    {lang === 'ar' ? 'English' : 'عربي'}
                                </button>
                                <a href="tel:+963900000000" className="bg-primary text-white px-8 py-3 rounded-2xl shadow-xl hover:scale-105 transition-transform flex items-center gap-2">
                                    <i className="fa-solid fa-phone"></i>
                                    {t.btnOrder}
                                </a>
                            </div>

                            <button className="lg:hidden text-3xl relative z-20 transition-colors text-brandYellow drop-shadow-md" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                <i className={`fa-solid ${isMenuOpen ? 'fa-xmark' : 'fa-bars-staggered'}`}></i>
                            </button>
                        </div>

                        <div className={`lg:hidden absolute top-full left-0 w-full bg-gray-900/95 backdrop-blur-3xl shadow-2xl transition-all duration-300 overflow-hidden border-t border-gray-700 ${isMenuOpen ? 'max-h-[500px] opacity-100 py-6' : 'max-h-0 opacity-0 py-0'}`}>
                            <div className="container mx-auto px-6 flex flex-col gap-6 text-center">
                                <a href="#" onClick={(e) => closeMenuAndNavigate(e, '#')} className="text-2xl font-black text-white hover:text-brandYellow transition-colors">{t.navHome}</a>
                                <a href="#menu" onClick={(e) => closeMenuAndNavigate(e, '#menu')} className="text-2xl font-black text-white hover:text-brandYellow transition-colors">{t.navMenu}</a>
                                <a href="#ai" onClick={(e) => closeMenuAndNavigate(e, '#ai')} className="text-2xl font-black text-primary flex items-center justify-center gap-2">{t.navAI} ✨</a>
                                <a href="#about" onClick={(e) => closeMenuAndNavigate(e, '#about')} className="text-2xl font-black text-white hover:text-brandYellow transition-colors">{t.navAbout}</a>
                                
                                <div className="h-[1px] bg-gray-700 my-2"></div>
                                
                                <button 
                                    onClick={() => { setLang(lang === 'ar' ? 'en' : 'ar'); setIsMenuOpen(false); }}
                                    className="flex items-center justify-between text-xl font-bold text-white bg-white/5 p-4 rounded-2xl border border-gray-700 hover:bg-white/10 transition-colors"
                                >
                                    <span>{lang === 'ar' ? 'Switch to English' : 'تغيير للغة العربية'}</span>
                                    <i className="fa-solid fa-language text-primary text-2xl"></i>
                                </button>
                            </div>
                        </div>
                    </nav>

                    <section id="home" ref={heroRef} className="relative w-full min-h-[100svh] flex items-center pt-24 overflow-hidden bg-gray-900">
                        <div className="absolute inset-0 z-0">
                            {heroImages.map((img, idx) => (
                                <div 
                                    key={idx}
                                    className={`absolute inset-0 hero-img-transition ${idx === heroIndex ? 'opacity-40' : 'opacity-0'}`}
                                >
                                    <img src={img} className="w-full h-full object-cover" alt="Hero" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-gray-900/60"></div>
                                </div>
                            ))}
                        </div>
                        
                        <div className="container mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center relative z-10">
                            <div className="lg:col-span-7 space-y-8 text-center lg:text-start animate-fade-in">
                                <div className="inline-flex items-center gap-3 bg-white/5 border border-white/10 px-6 py-2 rounded-full backdrop-blur-md">
                                    <span className="relative flex h-3 w-3">
                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brandYellow opacity-75"></span>
                                        <span className="relative inline-flex rounded-full h-3 w-3 bg-brandYellow"></span>
                                    </span>
                                    <span className="text-white font-bold tracking-widest text-sm uppercase">{t.heroBadge}</span>
                                </div>
                                
                                <h1 className="text-6xl md:text-8xl font-black text-white leading-[1.1]">
                                    {t.heroTitle} <br/>
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-brandYellow to-primary">
                                        {t.heroTitleColor}
                                    </span>
                                </h1>
                                
                                <p className="text-xl text-gray-300 max-w-2xl leading-relaxed font-semibold">
                                    {t.heroDesc}
                                </p>

                                <div className="flex flex-col sm:flex-row gap-6 justify-center lg:justify-start">
                                    <a href="#menu" onClick={(e) => closeMenuAndNavigate(e, '#menu')} className="group relative px-10 py-5 bg-primary rounded-3xl overflow-hidden shadow-[0_20px_50px_rgba(227,30,36,0.3)]">
                                        <div className="absolute inset-0 bg-brandYellow translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                                        <span className="relative z-10 text-white group-hover:text-darkBg font-black text-xl flex items-center justify-center gap-3">
                                            <i className="fa-solid fa-utensils"></i> {t.btnMenu}
                                        </span>
                                    </a>
                                    <div className="flex items-center justify-center gap-4 text-white font-bold px-4 py-2 border-s-4 border-brandYellow">
                                        <span className="text-3xl text-brandYellow">0$</span>
                                        <span className="text-sm uppercase tracking-tighter opacity-80">{t.freeDelivery}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="ai" className="py-24 relative bg-white">
                        <div className="container mx-auto px-6">
                            <div className="max-w-5xl mx-auto rounded-[4rem] overflow-hidden bg-darkBg relative shadow-2xl">
                                <div className="absolute -top-10 -end-10 p-12 opacity-5 pointer-events-none">
                                    <i className="fa-solid fa-microchip text-[20rem] text-white"></i>
                                </div>
                                <div className="p-8 md:p-16 relative z-10">
                                    <div className="mb-12">
                                        <h2 className="text-4xl md:text-5xl font-black text-white mb-6">
                                            {t.aiTitle} <span className="text-brandYellow">✨</span>
                                        </h2>
                                        <p className="text-gray-400 text-lg font-semibold">{t.aiDesc}</p>
                                    </div>

                                    <div className="space-y-6">
                                        <div className="relative">
                                            <textarea 
                                                value={aiInput}
                                                maxLength="150"
                                                onChange={(e) => setAiInput(e.target.value)}
                                                dir="auto"
                                                className="w-full bg-white/5 border-2 border-white/10 rounded-4xl p-8 text-white focus:outline-none focus:border-brandYellow transition-all text-xl placeholder-gray-400 resize-y max-h-64"
                                                placeholder={t.aiPlaceholder}
                                                rows="3"
                                            ></textarea>
                                            
                                            <div className="absolute bottom-6 end-6 text-gray-500 text-sm font-bold">
                                                {aiInput.length} / 150
                                            </div>

                                            <button 
                                                onClick={generateAIRecommendation}
                                                disabled={isAiLoading || !aiInput.trim() || aiCooldown > 0}
                                                className={`mt-6 w-full lg:w-auto px-12 py-5 bg-brandYellow text-darkBg font-black rounded-3xl transition-transform flex items-center justify-center gap-4 text-xl ${isAiLoading || !aiInput.trim() || aiCooldown > 0 ? 'opacity-50 cursor-not-allowed' : 'hover:scale-105 shadow-[0_0_20px_rgba(255,200,0,0.3)]'}`}
                                            >
                                                {isAiLoading ? (
                                                    <><i className="fa-solid fa-spinner fa-spin"></i> {t.aiThinking}</>
                                                ) : aiCooldown > 0 ? (
                                                    <><i className="fa-regular fa-clock"></i> انتظر {aiCooldown} ثانية...</>
                                                ) : (
                                                    <><i className="fa-solid fa-wand-magic-sparkles"></i> {t.aiBtn}</>
                                                )}
                                            </button>
                                        </div>

                                        <div className="bg-white/5 p-4 rounded-2xl flex items-center gap-4 text-brandYellow text-sm font-bold border border-brandYellow/10">
                                            <i className="fa-solid fa-shield-halved text-lg"></i>
                                            {t.aiVpn}
                                        </div>

                                        {aiError && (
                                            <div className="mt-4 p-5 bg-red-500/10 border border-red-500/30 rounded-3xl flex items-center gap-4 animate-fade-in text-red-200">
                                                <div className="w-10 h-10 bg-red-500/20 rounded-full flex items-center justify-center flex-shrink-0">
                                                    <i className="fa-solid fa-triangle-exclamation text-red-400"></i>
                                                </div>
                                                <p className="font-bold text-base md:text-lg leading-relaxed">{aiError}</p>
                                            </div>
                                        )}

                                        {aiResponse && (
                                            <div className="mt-8 p-8 md:p-10 bg-gradient-to-br from-primary/20 to-brandYellow/10 border-2 border-brandYellow/20 rounded-4xl animate-fade-in relative">
                                                <div className="absolute top-0 start-0 w-2 h-full bg-brandYellow rounded-s-4xl"></div>
                                                <div className="flex items-center gap-3 mb-6 border-b border-gray-700/50 pb-4">
                                                    <div className="w-10 h-10 bg-[#FFC800]/20 rounded-full flex items-center justify-center shrink-0">
                                                        <i className="fa-solid fa-wand-magic-sparkles text-[#FFC800]"></i>
                                                    </div>
                                                    <h3 className="text-xl font-black text-[#FFC800]">
                                                        {lang === 'ar' ? 'اقتراح المساعد الذكي:' : 'AI Suggestion:'}
                                                    </h3>
                                                </div>
                                                <div 
                                                    className="text-white text-lg md:text-xl leading-relaxed font-medium text-start"
                                                    dir="auto"
                                                    dangerouslySetInnerHTML={formatAIResponse(aiResponse)}
                                                />
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="menu" className="py-24 bg-[#f4f4f4]">
                        <div className="container mx-auto px-6">
                            <div className="text-center mb-16">
                                <h2 className="text-5xl md:text-6xl font-black text-darkBg mb-8">{t.menuTitle}</h2>
                                
                                <div className="relative flex items-center justify-center mb-12 max-w-full px-2">
                                    <button 
                                        onClick={() => scrollCategories('prev')}
                                        className="absolute start-0 z-10 w-10 h-10 bg-white border border-gray-100 shadow-[0_0_15px_10px_rgba(255,255,255,0.9)] rounded-full flex items-center justify-center text-primary hover:bg-gray-50 hover:scale-105 transition-all md:hidden focus:outline-none"
                                        aria-label="Scroll Left"
                                    >
                                        <i className={`fa-solid ${t.dir === 'rtl' ? 'fa-chevron-right' : 'fa-chevron-left'}`}></i>
                                    </button>

                                    <div 
                                        ref={categoryRef} 
                                        onScroll={handleCategoryScroll}
                                        className="flex gap-2 md:gap-4 overflow-x-auto no-scrollbar py-4 px-4 bg-white rounded-full shadow-lg border border-gray-100 max-w-full scroll-smooth flex-nowrap snap-x snap-mandatory touch-pan-x"
                                    >
                                        {['all', 'shawarma', 'crispy', 'pizza', 'burger', 'appetizers'].map(cat => (
                                            <button 
                                                key={cat}
                                                onClick={(e) => {
                                                    setActiveCat(cat);
                                                    setVisibleCount(8);
                                                    e.target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                                                }}
                                                className={`snap-center shrink-0 flex items-center justify-center px-6 md:px-8 py-3 rounded-full font-black whitespace-nowrap transition-all duration-300 min-w-[100px] ${
                                                    activeCat === cat 
                                                    ? 'bg-primary text-white category-tab-active scale-105' 
                                                    : 'text-gray-400 hover:text-primary hover:bg-gray-50'
                                                }`}
                                            >
                                                {t[cat]}
                                            </button>
                                        ))}
                                    </div>

                                    <button 
                                        onClick={() => scrollCategories('next')}
                                        className="absolute end-0 z-10 w-10 h-10 bg-white border border-gray-100 shadow-[0_0_15px_10px_rgba(255,255,255,0.9)] rounded-full flex items-center justify-center text-primary hover:bg-gray-50 hover:scale-105 transition-all md:hidden focus:outline-none"
                                        aria-label="Scroll Right"
                                    >
                                        <i className={`fa-solid ${t.dir === 'rtl' ? 'fa-chevron-left' : 'fa-chevron-right'}`}></i>
                                    </button>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                {displayedItems.map((item, idx) => (
                                    <div key={item.id} className="group bg-white rounded-[3rem] overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 animate-fade-in border border-gray-100 flex flex-col">
                                        <div className="h-64 overflow-hidden relative bg-gray-200">
                                            <div className="absolute inset-0 bg-gray-200 animate-pulse-fast"></div>
                                            <img src={item.img} loading="lazy" className="relative z-10 w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={item[lang]} />
                                            
                                            <div className="absolute top-4 end-4 bg-brandYellow text-darkBg font-black px-4 py-1 rounded-full text-sm shadow-md z-20">
                                                {item.price} SYP
                                            </div>
                                        </div>
                                        <div className="p-8 flex flex-col flex-1">
                                            <h3 className="text-xl font-black text-darkBg mb-6 flex-1">{item[lang]}</h3>
                                            <a href="tel:+963900000000" className="w-full py-4 border-2 border-gray-100 rounded-2xl font-black group-hover:bg-primary group-hover:text-white group-hover:border-primary transition-all text-center flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-cart-shopping"></i> {t.btnOrder}
                                            </a>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {visibleCount < filteredItems.length && (
                                <div className="text-center mt-16">
                                    <button 
                                        onClick={() => setVisibleCount(prev => prev + 4)}
                                        className="px-12 py-4 bg-darkBg text-white rounded-2xl font-black hover:bg-primary hover:scale-105 transition-all shadow-xl flex items-center gap-3 mx-auto"
                                    >
                                        <i className="fa-solid fa-chevron-down"></i> {t.loadMore}
                                    </button>
                                </div>
                            )}
                        </div>
                    </section>

                    <section id="branches" className="py-24 bg-white relative overflow-hidden">
                        <div className="container mx-auto px-6">
                            <div className="text-center mb-16">
                                <h2 className="text-5xl font-black text-darkBg mb-4 uppercase">{t.navBranches}</h2>
                                <div className="h-2 w-24 bg-brandYellow mx-auto rounded-full"></div>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-12 max-w-5xl mx-auto">
                                {[
                                    { title: t.branch1, desc: t.branch1Desc, icon: "fa-store" },
                                    { title: t.branch2, desc: t.branch2Desc, icon: "fa-shop" }
                                ].map((branch, i) => (
                                    <div key={i} className="group relative p-10 rounded-[3rem] bg-gray-50 border border-gray-200 shadow-xl hover:-translate-y-3 transition-all duration-500 overflow-hidden">
                                        <div className="absolute top-0 end-0 p-6 opacity-5 group-hover:scale-110 transition-transform">
                                            <i className={`fa-solid ${branch.icon} text-9xl text-darkBg`}></i>
                                        </div>
                                        <div className="relative z-10">
                                            <div className="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center text-white text-2xl mb-8 shadow-lg group-hover:rotate-12 transition-transform">
                                                <i className={`fa-solid fa-location-dot`}></i>
                                            </div>
                                            <h3 className="text-3xl font-black text-darkBg mb-4">{branch.title}</h3>
                                            <p className="text-gray-500 mb-8 font-bold leading-relaxed">{branch.desc}</p>
                                            <div className="inline-flex items-center gap-2 bg-green-100 text-green-700 px-4 py-1 rounded-full text-xs font-black uppercase">
                                                <span className="w-2 h-2 bg-green-600 rounded-full animate-pulse"></span>
                                                {t.statusOpen}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="about" className="py-24 bg-darkBg text-white relative">
                        <div className="container mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                            <div>
                                <h2 className="text-5xl font-black text-brandYellow mb-8">{t.navAbout}</h2>
                                <p className="text-xl text-gray-300 leading-relaxed mb-8 font-semibold">
                                    {t.footerDesc}
                                </p>
                                <div className="grid grid-cols-2 gap-8 text-center">
                                    <div className="p-6 bg-white/5 rounded-3xl border border-white/10 hover:bg-white/10 transition-colors">
                                        <div className="text-4xl font-black text-primary mb-2">+10</div>
                                        <div className="text-xs uppercase font-bold text-gray-400">Years Experience</div>
                                    </div>
                                    <div className="p-6 bg-white/5 rounded-3xl border border-white/10 hover:bg-white/10 transition-colors">
                                        <div className="text-4xl font-black text-primary mb-2">15k+</div>
                                        <div className="text-xs uppercase font-bold text-gray-400">Happy Customers</div>
                                    </div>
                                </div>
                            </div>
                            <div className="relative">
                                <img src="https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=800" className="rounded-[4rem] shadow-2xl rotate-3 hover:rotate-0 transition-transform duration-500" alt="Burger" />
                                <div className="absolute -bottom-6 -start-6 bg-brandYellow w-24 h-24 rounded-full flex items-center justify-center shadow-xl animate-bounce">
                                    <i className="fa-solid fa-star text-4xl text-darkBg"></i>
                                </div>
                            </div>
                        </div>
                    </section>

                    <footer className="bg-[#0a0f1a] text-white pt-24 pb-12 overflow-hidden relative border-t border-white/5">
                        <div className="container mx-auto px-6 relative z-10">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-16 mb-20">
                                <div className="lg:col-span-5 space-y-8">
                                    <div className="flex items-center gap-4">
                                        <img 
                                            src="https://placehold.co/150x150/FFC800/111827?text=Logo" 
                                            onError={handleImageError}
                                            className="w-16 h-16 rounded-2xl object-cover bg-white" 
                                            alt="Logo" 
                                        />
                                        <span className="text-3xl font-black tracking-tighter text-brandYellow">مأكولات الشام</span>
                                    </div>
                                    <p className="text-gray-400 text-lg max-w-md leading-relaxed mb-8">
                                        نحن نسعى دائماً لتقديم أفضل تجربة وجبات سريعة في مدينة حماة، مع التركيز على الجودة والسرعة والخدمة الممتازة.
                                    </p>
                                    <div className="flex gap-4">
                                        <a href="#" className="w-12 h-12 bg-white/5 rounded-full flex items-center justify-center hover:bg-[#FFC800] hover:text-black transition-all text-xl"><i className="fa-brands fa-instagram"></i></a>
                                        <a href="tel:+963900000000" className="w-12 h-12 bg-white/5 rounded-full flex items-center justify-center hover:bg-green-500 transition-all text-xl"><i className="fa-solid fa-phone"></i></a>
                                    </div>
                                </div>
                                <div className="lg:col-span-3 space-y-6 mt-4">
                                    <h4 className="text-xl font-bold mb-8 text-[#FFC800] border-r-4 border-[#FFC800] pr-3">روابط سريعة</h4>
                                    <ul className="space-y-4 text-gray-400 font-bold">
                                        <li><a href="#" className="hover:text-white transition-colors block w-fit">عن المطعم</a></li>
                                        <li><a href="#menu" className="hover:text-white transition-colors block w-fit">قائمة الطعام</a></li>
                                        <li><a href="#branches" className="hover:text-white transition-colors block w-fit">مواقعنا</a></li>
                                        <li><a href="#" className="hover:text-white transition-colors block w-fit">سياسة التوصيل</a></li>
                                    </ul>
                                </div>
                                
                                <div className="lg:col-span-4 bg-white/5 p-8 rounded-4xl border border-white/10 text-center md:text-start flex flex-col justify-center">
                                    <h4 className="text-xl font-bold mb-4 text-gray-300">{lang === 'ar' ? 'اطلب هاتفيًا الآن' : 'Order by Phone Now'}</h4>
                                    <div className="text-5xl md:text-6xl font-black text-brandYellow mb-4 tracking-widest drop-shadow-lg" dir="ltr">+963 900 000 000</div>
                                    <div className="text-gray-500 font-bold uppercase tracking-widest text-sm">{t.statusOpen}</div>
                                </div>
                            </div>
                            
                            <div className="pt-8 border-t border-white/10 text-center text-gray-500 text-sm flex flex-col items-center gap-3">
                                <p>© {new Date().getFullYear()} {t.copyright}.</p>
                                
                                <div className="flex flex-col items-center gap-2 mt-2 bg-white/5 p-4 rounded-2xl border border-white/10">
                                    <div className="mb-1">
                                        صُنع بواسطة <span className="text-[#FFC800] font-bold text-base px-1">{t.developerName}</span> 
                                    </div>
                                    <a href="https://instagram.com/muafaq_kelani" target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 hover:text-[#FFC800] transition-colors" dir="ltr">
                                        <i className="fa-brands fa-instagram text-[#FFC800] text-lg"></i>
                                        <span className="font-bold">@muafaq_kelani</span>
                                    </a>
                                    <a href="tel:+963937779776" className="flex items-center gap-2 hover:text-white transition-colors text-[#25D366]" dir="ltr">
                                        <i className="fa-brands fa-whatsapp text-lg"></i>
                                        <span className="font-bold">+963 937 779 776</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </footer>

                    <a 
                        href="https://wa.me/963900000000" 
                        target="_blank"
                        className="lg:hidden fixed bottom-8 left-8 bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform z-[100] flex items-center justify-center group gap-3 border-[3px] border-white"
                    >
                        <i className="fa-brands fa-whatsapp text-4xl"></i>
                    </a>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
